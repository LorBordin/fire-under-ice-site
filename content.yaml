        On Kaldaklofsjökull, in the Torfa caldera, we found Freyja Hellir in
        2026: a new glaciovolcanic cave, almost 1500 m surveyed. From the
        surface, only a faint hollow in the snow. Below it, a hall about 50 m
        across and roughly 40 m high.
      - >-
        In 2027 we go back to the caldera, this time on its main glacier,
        Torfajökull.
    photos:
      - source: photos/torfa/river_crossing.JPG
        author: Paolo Testa
        caption: River crossing on the way to the Torfa caldera, 2026.
