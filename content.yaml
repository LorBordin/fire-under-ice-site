# Science pages (one page each at fireunderice.org/<slug>/). Shown only with
# `reviewed: true` (exactly true). Drafts may contain TODO. Numbers in [ ]
# point to the references list of the same topic. See GUIDE.md, "Science pages".
topics:
  - slug: microbiology
    kicker: Science
    title: Life without light
    teaser: >-
      No sunlight reaches the floor of a glaciovolcanic cave, yet microbes
      live there. In 2026 we sampled them at many sites, to learn how.
    intro:
      - >-
        Under the ice, nothing can live on sunlight. Yet where volcanic heat and
        gas reach the cave floor we found microbial mats and biofilms [1], and
        in places like these life can run on chemical energy instead [2]. In
        2026 we sampled them at many sites, at Kverkfjöll and in the Torfa
        caldera [1].
      - >-
        Why these places matter to microbiologists, what we collected, and what
        happens to the samples now.
    chapters:
      - heading: Dark, poor, volcanic
        paragraphs:
          - >-
            Scientists call these places DOVEs: dark oligotrophic volcanic
            ecosystems. Dark, because no light reaches them. Oligotrophic,
            because they are poor in organic matter. Volcanic, because heat and
            gas come from below. They are rich in chemical reactants, which makes
            them good places to study life without sunlight [2, 3].
          - >-
            Without light there is no photosynthesis. Microbes take their energy
            from chemistry instead, for example by oxidising gases such as
            hydrogen sulfide, and some build their bodies from CO₂. This way of
            life is called chemolithoautotrophy [2, 4].
          - >-
            In our caves the range is extreme. The air stays
            at 1–4 °C, next to ice at melting point, while the ground at the
            fumarole vents reached 94.5 °C, boiling point at about 1700 m. Our
            gas detectors found hydrogen, methane, hydrogen sulfide and carbon
            dioxide. Heat-loving (thermophilic), acid-loving (acidophilic) and
            cold-loving (psychrophilic) microbes can live side by side [1].
          - >-
            Sulfur-rich glaciovolcanic caves are rare. One of the few studied in
            detail is the fumarole ice cave on Mount Meager, Canada, the only
            known glaciovolcanic cave system in North America that steadily
            releases sulfur-rich gases. There, microbes that oxidise sulfur and
            microbes that reduce sulfate point to life on chemical energy [4]. At Kverkfjöll itself, a
            hot spring fed by the ice hosts communities that live on volcanic
            sulfur [5].
        photo:
          source: photos/torfa/RIMG0247.JPG
          author: Ivan Vicenzi
          caption: The hot pool at the centre of the Sala del Graal, Freyja Hellir, July 2026.
          alt: A thermometer probe held into a dark rippled pool rimmed with orange and rust-coloured mineral deposits.
      - heading: What we sampled in 2026
        paragraphs:
          - >-
            At Kverkfjöll we sampled near fumaroles and boiling pools inside the
            caves. We took sediment in triplicate at increasing distances from
            the vents, following the drop in temperature; sediment from the rims
            of boiling pools; biofilm from ice walls in well-ventilated spots;
            and hot water from a large pool fed by a methane-rich fumarole. This
            material was collected with the agreement of Vatnajökull National
            Park [1].
          - >-
            At the bottom of the Encelado cauldron, a spring at about 74 °C, with
            a flow of many litres per second, melts a lake under the glacier. We
            sampled around it [1].
          - >-
            In Freyja Hellir, in the Torfa caldera, fumaroles and hot springs at
            different distances from the entrance host soft, creamy, coloured
            microbial mats. Outside the cave, at the edge of an acidic fumarole
            rich in hydrogen sulfide, we sampled snottites: jelly-like microbial
            colonies that hang like small stalactites. Along a thermal stream we
            sampled filamentous communities [1].
        photo:
          source: photos/science/sampling_1.JPG
          author: Cristian Monticone
          caption: Sampling at a hot pool, July 2026.
          alt: Gloved hands take a sample with a pipette from an orange hot pool.
      - heading: What comes next
        paragraphs:
          - >-
            The samples are waiting for DNA sequencing and metagenomic analysis,
            in a collaboration with Prof. Andrea Franzetti, a glacial
            microbiologist at the University of Milano-Bicocca. In the team,
            sampling is led by Paolo Turrini, PhD in microbiology [1].
          - >-
            Why it matters. Life that runs on chemistry in the dark, where ice
            meets volcanic heat, is a model for habitats that may once have
            existed on Mars [6]. Microbes adapted to heat, acid or cold may also
            resemble early life on Earth, and their enzymes, which keep working
            in such conditions, interest biotechnology [1].
        photo:
          source: photos/science/sampling_2.jpg
          author: Cristian Monticone
          caption: Collecting sediment under the ice, 2026.
          alt: A caver in a red helmet and half-mask collects sediment from rocky ground under an ice arch.
      - heading: In 2027
        paragraphs:
          - >-
            TODO (Paolo Turrini): sampling plans for 2027 on Torfajökull (sites,
            what will be sampled, and how), and any first results from the 2026
            samples that can be shared. Also: which permit covered the Torfa
            samples, and a literature reference for early life and
            biotechnology in "What comes next".
    references:
      - text: "Consorzio Speleologi Ipogenici (2026). Vatnajökull 2026 – Fire Under Ice: notes on the expedition. Report to the Società Geografica Italiana, unpublished."
      - text: "Tebo, B. M., Davis, R. E., Anitori, R. P., Connell, L. B., Schiffman, P., & Staudigel, H. (2015). Microbial communities in dark oligotrophic volcanic ice cave ecosystems of Mt. Erebus, Antarctica. *Frontiers in Microbiology*, 6, 179."
