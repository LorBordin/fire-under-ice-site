        url: https://doi.org/10.3390/biology2020798
      - text: "Clance, J. J., Shaffer, J. M. C., Cable, M. L., et al. (2024). Biogeochemistry of the rare sulfidic glaciovolcanic cave system on Mount Meager, British Columbia, Canada. *Frontiers in Geochemistry*, 2, 1410338."
        url: https://doi.org/10.3389/fgeoc.2024.1410338
      - text: "Cousins, C. R., Fogel, M., Bowden, R., et al. (2018). Biogeochemical probing of microbial communities in a basalt-hosted hot spring at Kverkfjöll volcano, Iceland. *Geobiology*, 16(5), 507–521."
        url: https://doi.org/10.1111/gbi.12291
      - text: "Cousins, C. R., & Crawford, I. A. (2011). Volcano-ice interaction as a microbial habitat on Earth and Mars. *Astrobiology*, 11(7), 695–710."
        url: https://doi.org/10.1089/ast.2010.0550
    reviewers: Paolo Turrini, then Prof. Andrea Franzetti
    reviewed: false

  - slug: analogues
    kicker: Science
    title: Other worlds on Earth
    teaser: >-
      Icy moons hide oceans warmed from below. Iceland's glaciovolcanic caves are
      among the few places on Earth where ice sits over volcanic heat.
    intro:
      - >-
        Some moons of the outer Solar System hide oceans under their ice, warmed
        from below. On Earth, few places put ice directly over volcanic heat.
        Iceland's glaciovolcanic caves are among them, which makes them useful
        to planetary scientists, as long as one is careful about what carries
        over and what does not.
    chapters:
      - heading: Ice over heat, elsewhere
        paragraphs:
          - >-
            Enceladus, a small moon of Saturn, has an ocean under its ice. The
            Cassini spacecraft detected tiny grains of silica, traced back to
            Enceladus, that point to hydrothermal reactions above 90 °C on the
            ocean floor [1]. Flying through the plume that jets from the moon's
            south pole, it found molecular hydrogen, a sign that water is
            reacting with rock, as around hydrothermal vents on Earth [2]. Ice
            grains from the plume carry phosphates too: the ocean water holds at
            least 100 times more phosphorus than Earth's oceans [3].
          - >-
            The *Encelado* cauldron at Kverkfjöll takes its name from this moon:
            a steaming pit in the glacier with a hot spring at its bottom.
          - >-
            Jupiter's moon Europa gives strong evidence of an ocean too: the
            Galileo spacecraft measured a magnetic signal that changes the way a
            buried, electrically conducting ocean would make it change [4]. On
            Mars there is widespread evidence of possible volcano–ice
            interaction in the past. Where volcanoes and ice meet, they make
            liquid water and steep gradients of heat and chemistry, so on Mars
            they may once have offered habitats for life [5].
        photo:
          source: photos/kverkfjoll/P7161033.JPG
          author: Andrea Benassi
          caption: The Encelado cauldron, Kverkfjöll, July 2026.
          alt: Steam rises from a deep ice cauldron with a green lake at its bottom; a caver in yellow watches from the rim.
      - heading: What carries over, and what doesn't
        paragraphs:
          - >-
            What carries over: darkness, cold ice, liquid water made by heat from
            below, and energy from chemistry rather than light. Microbes that
            live this way on Earth show what kind of life could live that way
            elsewhere [5, 6].
          - >-
            Minerals carry over too. At Kverkfjöll and Askja, hot water altering
            basalt under the ice leaves minerals similar to those found on Mars;
            knowing how they form here helps recognise them there [7]. On icy
            moons, activity under the ice may carry traces of life from below and
            leave them on the surface ice, as proposed for the sulfur-rich cave
            on Mount Meager [8].
          - >-
            What does not carry over: our caves breathe Earth's atmosphere, with
            its oxygen, pressure and gravity. They are shielded from the
            radiation that hits icy moons, and they exchange air and microbes
            with the surface, visitors included [9]. An analogue is a comparison,
            not a copy.
      - heading: Caves on other worlds
        paragraphs:
          - >-
            Fumarolic ice caves have a warm, moist, stable microclimate, shielded
            from radiation, which can be hospitable to life. The highest
            permanent bodies of liquid water in Antarctica and North America are
            inside such caves [10].
          - >-
            Ocean worlds such as Enceladus and Europa almost certainly have voids
            in their ice; Mars' polar caps, and perhaps Titan and Pluto, may have
            them too. Comparing the fumarolic ice caves of Mount Erebus, Mount
            Rainier, Mount St. Helens and Villarrica helps picture those voids
            [10]. Iceland's caves add more cases to the comparison.
        photo:
          source: photos/torfa/torfa_final_stream.JPG
          author: Cristian Monticone
          caption: A stream through the ice, Freyja Hellir, July 2026.
          alt: A caver in yellow walks beside a stream along a long round ice tunnel, orange sediment on the right.
      - heading: What we add
        paragraphs:
          - >-
            We are cavers, not planetary scientists. What we bring is access and
            data: surveys of caves that may vanish within a year, air and water
            temperatures, gas readings, and samples for microbiologists [11].
          - >-
            In 2027 we add lidar: three-dimensional models of the voids, from the
            inside. Repeated year after year, they show how a cave under the ice
            forms and disappears, the kind of field data that comparisons with
            other worlds need.
          - >-
            If you work on planetary analogues and could use these data, write
            to us.
    references:
      - text: "Hsu, H.-W., Postberg, F., Sekine, Y., et al. (2015). Ongoing hydrothermal activities within Enceladus. *Nature*, 519(7542), 207–210."
        url: https://doi.org/10.1038/nature14262
      - text: "Waite, J. H., Glein, C. R., Perryman, R. S., et al. (2017). Cassini finds molecular hydrogen in the Enceladus plume: Evidence for hydrothermal processes. *Science*, 356(6334), 155–159."
        url: https://doi.org/10.1126/science.aai8703
      - text: "Postberg, F., Sekine, Y., Klenner, F., et al. (2023). Detection of phosphates originating from Enceladus's ocean. *Nature*, 618(7965), 489–493."
        url: https://doi.org/10.1038/s41586-023-05987-9
