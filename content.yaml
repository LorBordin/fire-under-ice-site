# "Why research here" block above the Science cards (brochure p8c).
# Task 7: uncomment `topic: analogues` once /analogues/ exists.
science_why:
  kicker: Why research here
  title: Where ice meets magma
  items:
    - title: Ice and volcanoes
      text: How geothermal heat and glaciers reshape each other, seen from inside.
    - title: A changing climate
      text: Field data for models of how glaciovolcanic systems evolve as the ice retreats.
    - title: Jökulhlaups
      text: The meltwater paths behind glacial outburst floods.
    - title: Other worlds
      text: "Dark, oligotrophic, volcanic environments: Earth analogues for icy moons such as Enceladus."
      # topic: analogues
  photos:
    - image: img/why-sampling-1
      image_alt: Gloved hands take a sample with a pipette from an orange hot pool.
      credit: Cristian Monticone
    - image: img/why-sampling-2
      image_alt: A caver in a helmet and half-mask collects sediment at the foot of an ice wall.
      credit: Cristian Monticone

science:                                 # brochure p9, p11
  - title: Microbiology
    text: >-
      Samples from every cave explored, at Kverkfjöll and Torfa, for the
      University of Milano-Bicocca.
    image: img/science-pool
    image_alt: A thermometer probe held into a dark pool rimmed with orange mineral deposits.
    credit: Ivan Vicenzi
  - title: Monitoring
    text: >-
      Air and water temperature sensors and timelapse cameras, placed in July and
      recovered in September by a team led by Lee J. Florea, PhD, Christian
      Stenner and Linda Sobolewski, PhD (University of Iceland).
    image: img/science-thermal
    image_alt: A hand holds a thermal camera whose screen shows a warm stream in rainbow colours, inside an ice cave.
    credit: Paolo Testa
  - title: Photogrammetry
    text: >-
      Drone models of the Encelado cauldron, July and September 2026. In 2027 we
      add lidar: the same voids in three dimensions, from the inside.
    image: img/f7-ortho
    image_alt: Drone orthophoto of Efri Hveradalur, Kverkfjöll, seen from above, north up.
    figure: img/f7-3d
    figure_alt: 3D model of Efri Hveradalur, Kverkfjöll, from drone photogrammetry, with Lake Galtarlón in front.
    figure_caption: "Efri Hveradalur, Kverkfjöll, 2026: 3D model from drone photogrammetry, Lake Galtarlón in front."
    # Interactive version (made by make_model.py); a button under the picture loads it.
    model: model/hveradalur-2026.glb

csi:                                     # website_spec "About CSI"
  name: Consorzio Speleologi Ipogenici
  logo: img/logos/csi_logo_crop.png
  blurb:
    - From different caving groups across Italy, *Indipendenti* in spirit, *Ipogenici* by vocation.
    - >-
      The name nods to the Italian band CSI, *Consorzio Suonatori Indipendenti*:
      a team from different regions and caving groups needed an informal name,
      and *Consorzio Speleologi Indipendenti* fitted. *Ipogenici* replaced
      *Indipendenti* because hypogenic caves are what we look for.

# Team: shown only with `consent: true` (exactly true). Ask each person first.
# role: what they do in the expedition (shown in red); line: short bio (brochure p13).
# 2026-11: all participants enabled by Lorenzo.
team:                                    # order: by role, as given by Lorenzo
  - group: Core team
    members:
      - name: Andrea Benassi
        role: Research, site selection, team building, public relations
        line: PhD in Anthropology. Advisor to the Italian Speleological Society (SSI). Has organised over 30 international expeditions.
        photo: img/team/benassi.webp
        consent: true
      - name: Lorenzo Bordin
        role: Logistics, partner and park relations, data processing, publications
        line: PhD in Theoretical Physics. SSI instructor. Ice caves, cave survey and drone photogrammetry.
        photo: img/team/bordin.webp
        consent: true
      - name: Maria F. Trombini
        role: Food supplies and rations, drone photogrammetry
        line: SSI speleology instructor. Ice caves since 2023; expeditions in Italy, France, Slovenia, Albania, Austria, UK.
        photo: img/team/trombini.webp
        consent: true
      - name: Cristian Monticone (Lazzaro)
        role: Lead explorer in the most hazardous passages
        line: Vice President, Gruppo Speleologico Piemontese; CNSAS. Breathing apparatus and confined spaces.
        photo: img/team/monticone.webp
        consent: true
      - name: Mattia Gerbaudo (Jerba)
        role: Technical gear, confined-space safety, high-risk descents
        line: Industrial safety specialist. CNSAS rescuer, CAI mountaineering instructor. Gas and safety lead.
        photo: img/team/gerbaudo.webp
        consent: true
  - group: Exploration and field operations
    members:
      - name: Carlo Urbanet
        role: Exploration, field coordination, food and medical supplies
        line: Engineer, National Speleology Instructor (SSI), CNSAS technician. Explorations in Ethiopia, Iran, Brazil.
        photo: img/team/urbanet.webp
        consent: true
      - name: Ivan Vicenzi
        role: Exploration, field support, photography
        line: Rescue operator for over 23 years and technical diver. Expeditions to West Papua, Laos, Honduras.
        photo: img/team/vicenzi.webp
        consent: true
      - name: Marco Ettrapini
        role: Exploration, field support
        line: Chemist and assistant speleology instructor. Mountaineering, rock and ice climbing, canyoning.
        photo: img/team/ettrapini.webp
        consent: true
  - group: Science and confined spaces
    members:
      - name: Paolo Turrini
        role: Microbiological research and sampling (Bicocca)
        line: PhD in Microbiology. Rope access and confined-space specialist; caving in Indonesia, Mexico, Morocco.
        photo: img/team/turrini.webp
        consent: true
      - name: Lorenzo Scialò
        role: Exploration, confined spaces, biological sampling support
        line: Rope access technician and industrial rescuer. Expeditions to Mexico, Greece, Albania, Montenegro.
        photo: img/team/scialo.webp
        consent: true
      - name: Katia Zampatti
        role: Exploration, confined spaces, biological sampling support
        line: Industrial rescuer, canyoner, alpinist. Member of the Italian Speleological Society. Caving in Norway and Iceland.
        photo: img/team/zampatti.webp
        consent: true
  - group: Documentation
    members:
      - name: Tommaso Biondi
        role: Photography, filming, documentary
        line: Caving and mountain documentary maker, award-winning. Films in Africa, South America and West Papua.
        photo: img/team/biondi.webp
        consent: true
      - name: Paolo Testa
        role: Photography
        line: National Speleology Instructor (CAI), caving since 1987. Founded Progetto Speleologia Glaciale in 2008.
        photo: img/team/testa.webp
        consent: true

