# In the field: what the conditions demand (brochure p12 variants).
field:
  - title: Rivers
    text: Gear carried on foot for days, through glacial rivers.
    image: img/field-river
    image_alt: Two people with yellow rucksacks wade across a wide, shallow river.
    credit: Paolo Testa
  - title: Rotten ice
    text: Anchors in poor ice and firn have to hold.
    image: img/field-descent
    image_alt: A caver hangs on a rope inside a deep shaft in white glacier ice.
    credit: Lorenzo Bordin
  - title: Air you cannot trust
    text: >-
      Cavities under the ice trap CO₂, H₂S and SO₂. In Freyja Hellir the
      detector alarmed at 5 % CO₂, above the 4 % NIOSH lists as immediately
      dangerous, and we turned back. We monitor gas continuously. Full-face
      respirators with ABEKP filters are a safety layer only: they do not stop
      CO₂, CO or low oxygen. Any alarm, we leave.
    image: img/field-gas
    image_alt: A caver in a helmet and respirator points at a boiling vent in thick steam.
    credit: Andrea Benassi
  - title: Heat
    text: Water from 0.2 to 59.4 °C, ground up to 47 °C.
    image: img/field-heat
    image_alt: A caver with a respirator in thick steam rising from the ground.
    credit: Andrea Benassi

