[project]
name = "fire-under-ice-site"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
# Tools that make files in static/ (make_model.py, make_comparison.py), run by hand:
#   uv run --group assets <script>.py
# Not needed to build the site, so CI never installs them.
assets = [
    "numpy>=2.5.4",
    "pymeshlab>=2025.7.post1",
]
