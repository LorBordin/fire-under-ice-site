{% from "macros.html" import image, header, play_icon %}
<section id="watch" class="reveal">
  {{ header(c.headings.watch) }}
  <a class="video" href="https://www.youtube.com/watch?v={{ c.video.youtube_id }}" data-youtube="{{ c.video.youtube_id }}" data-title="{{ c.video.title }}" rel="noopener">
    {{ image(c.video.thumbnail, c.video.thumbnail_alt, sizes="(min-width: 48rem) 70vw, 100vw") }}
    {{ play_icon() }}
    <span class="video-label">Play video on YouTube</span>
  </a>
</section>
